name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without v prefix'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov build twine pipx

      - name: Validate version and changelog
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            python scripts/validate_version.py "${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version || '' }}" ]]; then
            python scripts/validate_version.py "v${{ github.event.inputs.version }}"
          else
            python scripts/validate_version.py
          fi
          python scripts/check_changelog.py

      - name: Verify licensing documents
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f LICENSING.md
          test -f COMMERCIAL_LICENSE.md
          test -f CLA.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f ORDER_FORM_TEMPLATE.md
          test ! -f LICENSE-AGPLv3
          test ! -f LICENSE-COMMERCIAL

      - name: Run release smoke tests
        run: |
          pytest tests/test_cli.py tests/test_extended_ratio.py tests/test_extended_ratio_semantic_parity.py --no-cov
          python benchmarks/claim_closure_benchmarks.py
          python scripts/check_doc_claims.py

      - name: Run Lean formal audit
        run: |
          cd formal
          lake build
          lake env lean FormalAudit.lean

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    name: Test install on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install from local wheel with pip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels = sorted(Path('dist').glob('*.whl'))
          if not wheels:
              raise SystemExit('No wheel found in dist/')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--upgrade', 'pip'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])
          PY
          python -c "import balansis; assert balansis.__version__ == '1.0.0'; print(balansis.__version__)"
          balansis --version
          balansis doctor

      - name: Install from local wheel with pipx
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          python - <<'PY'
          from pathlib import Path
          import subprocess
          wheels = sorted(Path('dist').glob('*.whl'))
          if not wheels:
              raise SystemExit('No wheel found in dist/')
          subprocess.check_call(['pipx', 'install', '--force', str(wheels[0])])
          PY
          pipx runpip balansis show balansis
          pipx run --spec dist/*.whl balansis --version

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, test-install]
    environment: test-release

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment: release

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        run: |
          python scripts/generate_release_notes.py ${GITHUB_REF_NAME#v} > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
