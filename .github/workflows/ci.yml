name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8 pytest pytest-cov

      - name: Lint (syntax errors and undefined names)
        run: |
          flake8 balansis/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          pytest tests/

  formal:
    name: Formal Lean Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean libraries
        run: |
          cd formal
          lake exe cache get
          lake build BalansisFormal
          lake build ACT
          lake env lean FormalAudit.lean

      - name: Audit Lean sources (no axiom / sorry / admit)
        run: |
          # Scan only the project's own Lean sources, not the fetched
          # dependency tree under formal/.lake/ (Mathlib legitimately uses axioms).
          ! grep -Rnw formal --include='*.lean' --exclude-dir='.lake' -e '\baxiom\b'
          ! grep -Rnw formal --include='*.lean' --exclude-dir='.lake' -e '\bsorry\b'
          ! grep -Rnw formal --include='*.lean' --exclude-dir='.lake' -e '\badmit\b'
